<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShiroPrism</title>
    <meta name="description" content="ShiroPrism 的个人站点，正在建设中。">
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 15% 15%, #dce8ff 0, transparent 35%),
          radial-gradient(circle at 85% 85%, #e5dfff 0, transparent 35%),
          #f5f7fb;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #dbe2ef;
        border-radius: 1.5rem;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 1.5rem 4rem rgb(23 32 51 / 10%);
      }

      .mark {
        width: 3rem;
        height: 3rem;
        display: grid;
        place-items: center;
        border-radius: 0.9rem;
        background: #3157d5;
        color: white;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .eyebrow {
        margin: 1.5rem 0 0.5rem;
        color: #60708f;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.4rem);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .lead {
        margin: 1.25rem 0 0;
        color: #4c5a75;
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .links {
        margin: 2rem 0 0;
      }

      a {
        color: #2448bd;
        font-weight: 700;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 3px solid #9eb1ff;
        outline-offset: 4px;
        border-radius: 0.2rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111725;
          color: #eef2ff;
        }

        body {
          background:
            radial-gradient(circle at 15% 15%, #1d315f 0, transparent 35%),
            radial-gradient(circle at 85% 85%, #332a60 0, transparent 35%),
            #111725;
        }

        main {
          border-color: #29344d;
          background: rgb(20 28 45 / 90%);
          box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
        }

        .eyebrow,
        .lead {
          color: #b2bfd8;
        }

        a {
          color: #aebfff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">SP</div>
      <p class="eyebrow">ShiroPrism</p>
      <h1>个人站点正在建设中</h1>
      <p class="lead">这里将作为今后的个人主页与项目入口。旧博客内容仍保留在独立的存档站点中。</p>
      <p class="links"><a href="https://www.lolimama.love/">访问旧博客存档</a></p>
    </main>
  </body>
</html>
